<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MY JAPAN RAILWAY 150th ・ 駅スタンプ</title>
<meta name="description" content="JR站点印章归档">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root{
    --paper:#f4f1e8;
    --ink:#161513;
    --ink-2:#5d5a52;
    --line:#d6cfbd;
    --accent:#161513;
    --accent-2:#3d3b37;
    --accent-soft:#e6e1d5;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom);
  }
  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;background:rgba(244,241,232,.96);
    -webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .hrow{display:flex;align-items:center;gap:9px;padding:10px 14px 8px}
  .logo{width:36px;height:36px;flex:none;display:block}
  .tt{flex:1;min-width:0}
  h1{font-size:13px;margin:0;letter-spacing:.01em;font-weight:700;line-height:1.3}
  .sub{font-size:11px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .langs{display:flex;gap:4px;flex:none}
  .langs button{
    font:inherit;font-size:11px;padding:4px 7px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);border-radius:7px;cursor:pointer
  }
  .langs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .prog{display:flex;align-items:center;gap:8px;padding:0 14px 9px}
  .progbar{flex:1;height:5px;border-radius:3px;background:#e3ddcd;overflow:hidden}
  .progbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .progtext{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* ---------- tabs ---------- */
  nav.tabs{display:flex;gap:2px;padding:0 10px;background:rgba(244,241,232,.96);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:29}
  nav.tabs button{
    font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);background:none;border:0;
    padding:9px 14px 8px;border-bottom:2px solid transparent;cursor:pointer;flex:1
  }
  nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  /* ---------- panes ---------- */
  main{padding:12px 12px 48px}
  section[hidden]{display:none}
  .tools{display:flex;gap:8px;margin-bottom:8px}
  input[type=search]{
    flex:1;min-width:0;font-size:14px;padding:9px 11px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink);font-family:inherit
  }
  input[type=search]:focus{outline:2px solid rgba(22,21,19,.28);outline-offset:-1px}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:9px 13px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{color:var(--ink-2)}
  .stat{font-size:11px;color:var(--ink-2);padding:2px 0 10px}
  .regions{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .regions::-webkit-scrollbar{display:none}
  .regions button{font:inherit;font-size:12px;padding:5px 11px;border-radius:15px;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);white-space:nowrap;cursor:pointer}
  .regions button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:7px 6px 8px;text-align:center;cursor:pointer;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    content-visibility:auto;contain-intrinsic-size:150px
  }
  .card figure{margin:0;width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;overflow:hidden}
  .card img{width:100%;height:100%;object-fit:contain;display:block}
  .card .nm{font-size:12px;font-weight:600;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .card.mine{border-color:#cfc9ba}
  .card .dist{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;
    letter-spacing:.01em;margin-top:-2px;white-space:nowrap}
  .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 2px #fff}
  .sentinel{height:40px}
  .empty{color:var(--ink-2);font-size:13px;padding:36px 16px;text-align:center;line-height:1.8}
  .empty .big{font-size:15px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px}
  /* ---------- stats ---------- */
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .panel h3{margin:0 0 12px;font-size:13px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;font-weight:700}
  .bigrow{display:flex;align-items:baseline;gap:8px}
  .bignum{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .bigsub{font-size:13px;color:var(--ink-2)}
  .meter{height:8px;border-radius:4px;background:#e3ddcd;overflow:hidden;margin:14px 0 6px}
  .meter i{display:block;height:100%;background:var(--accent)}
  .dist{display:flex;flex-direction:column;gap:8px}
  .drow{display:flex;align-items:center;gap:10px;font-size:12px}
  .drow .k{width:64px;color:var(--ink-2)}
  .drow .bar{flex:1;height:9px;border-radius:5px;background:#f0ece0;overflow:hidden}
  .drow .bar i{display:block;height:100%;background:var(--accent-2);opacity:.9}
  .drow .v{width:58px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
  .recent figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .recent img{width:100%;height:100%;object-fit:contain}
  /* ---------- modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(20,18,14,.62);display:none;z-index:50;
    align-items:center;justify-content:center;padding:6px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .mask.on{display:flex}
  .sheet{
    background:var(--paper);width:100%;max-width:600px;max-height:96vh;overflow:auto;
    border-radius:14px;padding:8px 8px 16px;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.35)
  }
  .close{position:absolute;top:4px;right:4px;width:34px;height:34px;padding:0;border:0;background:none;
    font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);z-index:2}
  .paper{
    position:relative;margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;
    aspect-ratio:1/1;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer
  }
  .paper img{max-width:none}
  .guide{position:absolute;left:50%;top:50%;width:81.6%;aspect-ratio:1/1;
    transform:translate(-50%,-50%);pointer-events:none;opacity:0}
  .guide.on{opacity:1}
  .guide img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
  .guide .area{opacity:0}
  .guide.on .area{opacity:1}
  .stampbox{position:absolute;left:50%;top:50%;width:71.8%;aspect-ratio:1/1;pointer-events:none;
    transform:translate(-50%,-50%) scale(1.2);opacity:0;visibility:hidden}
  .stampbox.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  .stampbox img{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 50%}
  .idle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
  .idle .icon{width:30px;height:41px;margin:0 auto}
  .idle .icon img{width:100%;height:100%;object-fit:contain;display:block}
  .idle p{font-size:13px;color:var(--ink-2);margin:10px 0 0;letter-spacing:.04em}
  .paper.pressing .idle,.paper.done .idle{display:none}
  .sheet h2{font-size:18px;margin:12px 2px 8px;font-weight:700}
  .stampbar{display:flex;flex-wrap:nowrap;gap:8px;align-items:center}
  .chip{font-size:12px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
  /* 墨量刻度条 */
  .inkbar{
    display:flex;gap:4px;flex:1;min-width:0;height:36px;align-items:center;
    padding:0 7px;border-radius:10px;background:#ecebe7;
    box-shadow:inset 0 1px 3px rgba(18,18,18,.10);
    touch-action:none;opacity:.45
  }
  .inkbar.ready{opacity:1;cursor:pointer}
  .inkbar i{
    flex:1;height:20px;border-radius:5px;background:#dcdad4;
    box-shadow:inset 0 1px 1px rgba(18,18,18,.05)
  }
  .inkbar i.on{box-shadow:inset 0 -1px 1px rgba(255,255,255,.20)}
  .inkbar i.on:nth-child(1){background:#b3b0a8}
  .inkbar i.on:nth-child(2){background:#96938c}
  .inkbar i.on:nth-child(3){background:#78756e}
  .inkbar i.on:nth-child(4){background:#57544e}
  .inkbar i.on:nth-child(5){background:#33312d}
  .inkbar i.on:nth-child(6){background:#111110}
  .iconbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;
    padding:0;border-radius:10px;color:var(--ink-2)}
  .iconbtn:active{background:#f1ece0}
  .iconbtn svg{width:17px;height:17px;display:block}
  .nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
  /* 关于页 */
  .panel.hero{text-align:center;padding:22px 16px}
  .about-logo{width:72px;height:72px;display:block;margin:0 auto 12px}
  .about-name{font-size:14px;font-weight:700}
  .about-ver{font-size:12px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
  .about-count{font-size:12px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
  #pane-about p{margin:0;font-size:13px;line-height:1.75;color:var(--ink-2)}
  @media (min-width:720px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
    main{padding:18px 22px 60px}
    .hrow{padding:12px 22px 8px}
    .prog{padding:0 22px 10px}
    nav.tabs{padding:0 18px}
    nav.tabs button{flex:none;padding:10px 22px}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <img class="logo" src="assets/logo.svg?v=2" alt="">
    <div class="tt">
      <h1 id="i18nTitle">MY JAPAN RAILWAY 150th ・ 駅スタンプ</h1>
      <div class="sub" id="i18nSub">JR站点印章归档</div>
    </div>
    <div class="langs" id="langs"></div>
  </div>
  <div class="prog">
    <div class="progbar"><i id="progFill" style="width:0%"></i></div>
    <div class="progtext" id="progText"></div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="all" class="on"></button>
  <button data-tab="near"></button>
  <button data-tab="mine"></button>
  <button data-tab="stats"></button>
  <button data-tab="about"></button>
</nav>

<main>
  <section id="pane-all">
    <div class="tools">
      <input type="search" id="q" autocomplete="off">
      <button class="btn" id="randomBtn"></button>
    </div>
    <div class="regions" id="regions"></div>
    <div class="stat" id="stat"></div>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel"></div>
  </section>

  <section id="pane-near" hidden>
    <div class="stat" id="nearStat"></div>
    <div class="empty" id="nearEmpty"></div>
    <div class="grid" id="nearGrid" hidden></div>
    <div class="row" id="nearActions" style="margin-top:14px" hidden>
      <button class="btn primary" id="nearBtn"></button>
    </div>
  </section>

  <section id="pane-mine" hidden>
    <div class="stat" id="mineStat"></div>
    <div class="regions" id="mineRegions" hidden></div>
    <div class="grid" id="mineGrid"></div>
    <div class="empty" id="mineEmpty"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="clearBtn"></button>
    </div>
  </section>

  <section id="pane-stats" hidden>
    <div class="panel">
      <h3 id="statsTitle"></h3>
      <div class="bigrow">
        <span class="bignum" id="statsPct">0%</span>
        <span class="bigsub" id="statsCount"></span>
      </div>
      <div class="meter"><i id="statsMeter" style="width:0%"></i></div>
    </div>
    <div class="panel">
      <h3 id="distTitle"></h3>
      <div class="dist" id="dist"></div>
    </div>
    <div class="panel">
      <h3 id="recentTitle"></h3>
      <div class="recent" id="recent"></div>
    </div>
  </section>

  <section id="pane-about" hidden>
    <div class="panel hero">
      <img class="about-logo" src="assets/logo.svg?v=2" alt="">
      <div class="about-name">MY JAPAN RAILWAY 150th ・ 駅スタンプ</div>
      <div class="about-ver" id="aboutVer"></div>
      <div class="about-count" id="aboutCount"></div>
    </div>
    <div class="panel">
      <h3 id="aboutSrcTitle"></h3>
      <p id="aboutSrc"></p>
    </div>
    <div class="panel">
      <h3 id="aboutNameTitle"></h3>
      <p id="aboutName"></p>
    </div>
    <div class="panel">
      <h3 id="aboutStoreTitle"></h3>
      <p id="aboutStore"></p>
    </div>
    <div class="panel">
      <h3 id="aboutCrTitle"></h3>
      <p id="aboutCr"></p>
    </div>
  </section>
</main>

<div class="mask" id="mask">
  <div class="sheet">
    <button class="close" id="close">✕</button>
    <div class="paper" id="paper">
      <div class="idle" id="idle">
        <div class="icon"><img src="assets/icon-touch--hand.png" alt=""></div>
        <p id="i18nTip"></p>
      </div>
      <div class="guide" id="guide">
        <img class="line" src="assets/img-guide--line.png" alt="">
        <img class="area" src="assets/img-guide--area.png" alt="">
      </div>
      <div class="stampbox" id="stampbox"><img id="mImg" alt=""></div>
    </div>
    <h2 id="mName">—</h2>

    <div class="stampbar">
      <div class="inkbar" id="inkbar"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <button class="chip iconbtn" id="mReset" title=""></button>
      <a class="chip iconbtn" id="mOpen" title=""></a>
    </div>

    <div class="nav">
      <button class="chip" id="prev"></button>
      <button class="chip" id="next"></button>
    </div>
  </div>
</div>

  }

  function resetStamp(){
    stamped = false; level = 6; pressing = false; pressStart = 0; pos = {x:0.5, y:0.5};
    paper.classList.remove('done', 'pressing');
    guide.classList.remove('on');
    stampbox.classList.remove('on');
    mImg.onerror = null; mImg.onload = null;
    mImg.style.filter = 'none'; mImg.style.transform = 'none';
    mImg.src = fullSrc(curId, 6);
    applyPoint();
    renderInk();
    paintUrl();
  }

  function showStamp(lvl){
    var want = lvl;
    mImg.onload = function(){ mImg.style.filter = 'none'; };
    mImg.onerror = function(){
      mImg.onload = null; mImg.onerror = null;
      mImg.style.filter = FALLBACK[want] || 'none';
      if (want < 6) mImg.src = fullSrc(curId, 6);
    };
    mImg.style.filter = FALLBACK[lvl] || 'none';
    mImg.src = fullSrc(curId, lvl);
  }

  function finish(ms){
    level = levelOf(ms);
    var tilt = TILT[Math.floor(Math.random() * TILT.length)];
    stamped = true; pressing = false;
    paper.classList.remove('pressing');
    paper.classList.add('done');
    guide.classList.remove('on');
    mImg.style.transform = 'rotate(' + tilt + 'deg)';
    showStamp(level);
    stampbox.classList.add('on');
    mine[curId] = {lv: level, tilt: tilt, at: Date.now()};
    saveMine();
    renderInk();
    paintUrl();
    renderProgress();
    renderAll();
    if (curTab === 'mine') renderMine();
    if (curTab === 'stats') renderStats();
  }

  /* 墨色条：盖完之后可以直接滑动改深浅 */
  var barDrag = false;
  function barLevel(e){
    var r = inkbar.getBoundingClientRect();
    if (!r.width) return level;
    var t = (e.clientX - r.left) / r.width;
    return Math.min(6, Math.max(1, Math.ceil(t * 6)));
  }
  function setInk(lv){
    if (!stamped || !mine[curId] || lv === level) return;
    level = lv;
    showStamp(level);
    mine[curId].lv = level;
    saveMine();
    renderInk();
    paintUrl();
  }
  inkbar.addEventListener('pointerdown', function(e){
    if (!stamped) return;
    e.preventDefault(); e.stopPropagation();
    barDrag = true;
    setInk(barLevel(e));
  });
  document.addEventListener('pointermove', function(e){
    if (barDrag && typeof e.clientX === 'number') setInk(barLevel(e));
  });
  document.addEventListener('pointerup', function(){
    if (!barDrag) return;
    barDrag = false;
    renderMine(); renderStats();
  });

  function beginPress(e){
    if (e && e.preventDefault) e.preventDefault();
    if (!curId || stamped || pressing) return;
    pressing = true; pressStart = Date.now();
    if (e && typeof e.clientX === 'number') setPoint(e.clientX, e.clientY);
    paper.classList.add('pressing');
    guide.classList.add('on');
  }
  function endPress(e){
    if (e && e.preventDefault) e.preventDefault();
    if (!curId || stamped || !pressing) return;
    finish(Date.now() - pressStart);
  }
  paper.addEventListener('pointerdown', beginPress);
  paper.addEventListener('pointerup', endPress);
  paper.addEventListener('pointercancel', endPress);
  document.addEventListener('pointerup', endPress);
  document.addEventListener('pointermove', function(e){
    if (pressing && typeof e.clientX === 'number') setPoint(e.clientX, e.clientY);
  });
  paper.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function open(id){
    var d = byId[id];
    if (!d) return;
    curId = id;
    mName.textContent = d.name || '';
    mask.classList.add('on');
    resetStamp();
  }
  function close(){
    mask.classList.remove('on');
    curId = null; pressing = false;
  }
  function step(dir){
    var i = -1;
    for (var k = 0; k < DATA.length; k++) if (DATA[k].id === curId) { i = k; break; }
    var n = DATA[(i + dir + DATA.length) % DATA.length];
    if (n) open(n.id);
  }

  $('close').addEventListener('click', close);
  els.reset.addEventListener('click', function(e){ e.stopPropagation(); resetStamp(); });
  mask.addEventListener('click', function(e){ if (e.target === mask) close(); });
  document.addEventListener('keydown', function(e){
    if (!curId) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  els.prev.addEventListener('click', function(){ step(-1); });
  els.next.addEventListener('click', function(){ step(1); });
  var OPEN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4l-8.6 8.6"></path><path d="M18.5 14.5V19a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2H10"></path></svg>';
  var RESET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"></path><path d="M20.5 3.5v5h-5"></path></svg>';
  els.open.innerHTML = OPEN_ICON;
  els.reset.innerHTML = RESET_ICON;
  els.open.addEventListener('click', function(e){
    if (!curUrl) return;
    e.preventDefault();
    location.href = curUrl;
  });

  applyLang();
  setTab('all');
})();
</script>
</body>
</html>
